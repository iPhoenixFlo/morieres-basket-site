<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#BA2A2F">
<title>MBC Jam - Morières Basket Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow:wght@600;700&family=Barlow+Condensed:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0d0d0d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;outline:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" tabindex="0"></canvas></div>
<script>
'use strict';
/* =================================================================
   MBC JAM — jeu d'arcade 2 contre 2 du Morières Basket Club
   -----------------------------------------------------------------
   Tout ce qui se personnalise est dans CONFIG ci-dessous.
   Notes des joueurs : de 1 à 10.
   peau / cheveux : couleurs utilisées pour dessiner le joueur.
   ================================================================= */
const CONFIG = {
  club: {
    nom: "MORIÈRES BASKET CLUB",
    court: "MBC",
    couleur: "#BA2A2F",
    fonce: "#8f1f23",
    clair: "#ffffff",
  },
  // Remplacer par les prénoms des joueurs du club (avec l'accord des familles pour les mineurs).
  joueurs: [
    { prenom: "Joueur 1", numero: 4,  vitesse: 8, tir: 6, trois: 5, dunk: 8, defense: 6, peau: "#f1c27d", cheveux: "#3b2416" },
    { prenom: "Joueur 2", numero: 7,  vitesse: 6, tir: 8, trois: 8, dunk: 4, defense: 5, peau: "#e0ac69", cheveux: "#1c1c1c" },
    { prenom: "Joueur 3", numero: 10, vitesse: 7, tir: 7, trois: 6, dunk: 7, defense: 7, peau: "#8d5524", cheveux: "#111111" },
    { prenom: "Joueur 4", numero: 11, vitesse: 5, tir: 5, trois: 3, dunk: 9, defense: 9, peau: "#c68642", cheveux: "#2a1a10" },
    { prenom: "Joueur 5", numero: 13, vitesse: 9, tir: 6, trois: 7, dunk: 6, defense: 5, peau: "#ffdbac", cheveux: "#b5832f" },
    { prenom: "Joueur 6", numero: 15, vitesse: 6, tir: 9, trois: 7, dunk: 5, defense: 6, peau: "#f1c27d", cheveux: "#6b3e1f" },
    { prenom: "Joueur 7", numero: 21, vitesse: 7, tir: 5, trois: 4, dunk: 8, defense: 8, peau: "#5c3a1e", cheveux: "#0d0d0d" },
    { prenom: "Joueur 8", numero: 23, vitesse: 8, tir: 7, trois: 6, dunk: 7, defense: 6, peau: "#e8b88a", cheveux: "#2b1b0e" },
  ],
  adversaire: {
    nom: "LES VISITEURS",
    court: "VIS",
    couleur: "#1f3d8f",
    fonce: "#142a63",
    clair: "#ffd23f",
    joueurs: [
      { prenom: "Le Mur",    numero: 5,  vitesse: 5, tir: 5, trois: 3, dunk: 8, defense: 9, peau: "#c68642", cheveux: "#111" },
      { prenom: "Turbo",     numero: 3,  vitesse: 9, tir: 6, trois: 6, dunk: 6, defense: 5, peau: "#ffdbac", cheveux: "#5a3a1a" },
      { prenom: "La Fusée",  numero: 8,  vitesse: 8, tir: 6, trois: 5, dunk: 8, defense: 6, peau: "#8d5524", cheveux: "#0d0d0d" },
      { prenom: "Le Sniper", numero: 30, vitesse: 6, tir: 8, trois: 9, dunk: 3, defense: 5, peau: "#f1c27d", cheveux: "#222" },
    ],
  },
  dureeQuartTemps: 120, // secondes
};

/* ================================================================= */
const VW = 960, VH = 540;              // résolution logique
const W = 1100, D = 500, TOP = 200;    // terrain (unités monde)
const RIM_Z = 100, RIM_R = 12, R3 = 237;
const GRAV = 0.42, BGRAV = 0.45;
const HOOPS = [{ x: 60, y: 250, bx: 45 }, { x: 1040, y: 250, bx: 1055 }];
const FONT = '"Barlow Condensed", Impact, "Arial Narrow", sans-serif';

const DIFF = [
  { nom: "FACILE",    steal: .001,  shove: .0003, block: .2,  agg: .7,  shot: -.08, inter: .5 },
  { nom: "NORMAL",    steal: .0025, shove: .0007, block: .4,  agg: 1,   shot: 0,    inter: .85 },
  { nom: "DIFFICILE", steal: .006,  shove: .002,  block: .65, agg: 1.25, shot: .05, inter: 1.3 },
];
const MATE = { steal: .003, shove: .0008, block: .45, agg: 1, shot: 0, inter: 1 };

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dxy = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pick = a => a[Math.floor(Math.random() * a.length)];
const attHoop = t => t === 0 ? HOOPS[1] : HOOPS[0];
const tdir = t => t === 0 ? 1 : -1;

const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx; // pointe vers l'écran ou vers le tampon basse résolution

/* ---------- état global ---------- */
const G = {
  scene: 'title', demo: true, diff: 1, frame: 0,
  teams: [], players: [], score: [0, 0], quarter: 1, clock: 0, shotClock: 24,
  poss: 0, pending: null, camX: 550, ann: [], parts: [], shake: 0, hype: 0,
  sel: [], cur: 0, breakT: 0, breakMsg: '', paused: false, muted: false, touch: false,
  over: null, nextShotId: 1, hitstop: 0, inRange: null, tags: [],
};
const ball = { x: 550, y: 250, z: 0, vx: 0, vy: 0, vz: 0, mode: 'loose', owner: null, shot: null, pass: null, through: false, fromShot: false };

function teamFrom(c) {
  return { nom: c.nom, court: c.court, couleur: c.couleur, fonce: c.fonce, clair: c.clair };
}
G.teams = [teamFrom(CONFIG.club), teamFrom(CONFIG.adversaire)];

/* =================================================================
   SON (synthétisé, aucun fichier)
   ================================================================= */
const AU = {
  ctx: null, out: null, nb: null, crowdG: null,
  init() {
    if (!this.ctx) {
      try {
        const a = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = a.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
        this.out = a.createGain(); this.out.gain.value = .9; this.out.connect(comp).connect(a.destination);
        const n = a.sampleRate * 2, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        this.nb = b;
        // rumeur du public, en continu, dont le volume suit l'action
        const src = a.createBufferSource(); src.buffer = b; src.loop = true;
        const f1 = a.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 650; f1.Q.value = .5;
        const f2 = a.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = 2200;
        this.crowdG = a.createGain(); this.crowdG.gain.value = 0;
        src.connect(f1).connect(f2).connect(this.crowdG).connect(this.out); src.start();
      } catch (e) { this.ctx = null; }
    }
    if (!this.ctx) return;
    // iPhone : jouer comme un média, pour ne pas être coupé par le bouton silencieux
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { }
    if (!this.media) {
      try {
        this.media = new Audio(silentWav()); this.media.loop = true; this.media.volume = .01;
        this.media.play().catch(() => { this.media = null; });
      } catch (e) { this.media = null; }
    }
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => { });
    // un son vide joué pendant le geste débloque l'audio sur les vieux iPhone
    try { const b = this.ctx.createBufferSource(); b.buffer = this.ctx.createBuffer(1, 1, 22050); b.connect(this.ctx.destination); b.start(0); } catch (e) { }
    VOICE.prime();
  },
  live() { return this.ctx && !G.muted && !G.demo; },
  tone(f, dur, type = 'square', vol = .1, slide = 0, delay = 0) {
    if (!this.live()) return;
    const a = this.ctx, o = a.createOscillator(), g = a.createGain(), t = a.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol, freq, type = 'bandpass', attack = .005, sweep = 0, q = 1, delay = 0) {
    if (!this.live()) return;
    const a = this.ctx, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + delay;
    src.buffer = this.nb; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    src.connect(f).connect(g).connect(this.out); src.start(t, Math.random() * 1.5); src.stop(t + dur + .05);
  },
  crowdLevel() {
    if (!this.crowdG) return;
    const on = !G.muted && !G.demo && (G.scene === 'play' || G.scene === 'break') && !G.paused;
    this.crowdG.gain.setTargetAtTime(on ? .05 + G.hype * .25 : 0, this.ctx.currentTime, .25);
  },
  clang(vol = .12) { [523, 1187, 1973, 2811].forEach((f, i) => this.tone(f, .5 - i * .08, 'triangle', vol / (i + 1))); },
  roar(v = .4, dur = 1.8) { this.noise(dur, v, 900, 'bandpass', .12, 0, .6); this.noise(dur * .8, v * .5, 2000, 'bandpass', .2, 0, .8); },
  dribble(v = .1) { this.tone(140, .07, 'sine', v, -80); this.noise(.03, v * .6, 1200, 'lowpass'); },
  squeak() { this.tone(2200, .07, 'sawtooth', .025, 700); this.tone(2900, .05, 'sine', .03, 500); },
  bounce() { this.tone(120, .09, 'sine', .3, -60); },
  swish() { this.noise(.22, .35, 5000, 'highpass', .01); this.noise(.35, .25, 1700, 'bandpass', .04, 900, 2); },
  rim() { this.clang(.14); this.tone(180, .12, 'sine', .25, -80); },
  pass() { this.noise(.1, .2, 1500, 'bandpass', .01, 4000, 1.5); },
  steal() { this.noise(.18, .4, 500, 'bandpass', .01, 3500, 2); this.tone(660, .08, 'square', .06, 600, .05); this.roar(.25, 1); },
  whiff() { this.noise(.12, .18, 800, 'bandpass', .01, 2500, 1.5); },
  block() { this.noise(.14, .7, 900, 'lowpass'); this.tone(220, .18, 'sine', .5, -150); this.roar(.3, 1.2); },
  shove() { this.tone(95, .3, 'sine', .9, -55); this.noise(.22, .6, 500, 'lowpass'); this.noise(1.1, .25, 520, 'bandpass', .15, 280, 1.5); },
  dunk() { this.tone(120, .55, 'sine', 1, -90); this.noise(.6, .5, 2600, 'highpass', .005); this.clang(.2); this.roar(.6, 2.4); },
  three() { this.roar(.45, 2); },
  score2() { this.roar(.22, 1.2); },
  buzzer() { this.tone(233, .95, 'sawtooth', .14); this.tone(236, .95, 'square', .07); },
  fire() { this.noise(1, .55, 250, 'bandpass', .08, 3000, 1.2); this.tone(110, .9, 'sawtooth', .1, 800); this.roar(.5, 2.2); },
  beep() { this.tone(1320, .08, 'square', .06); },
  blip() { this.tone(880, .05, 'square', .05); },
};

// Petit fichier WAV silencieux (0,5 s), généré à la volée.
function silentWav() {
  const n = 4000, buf = new Uint8Array(44 + n), v = new DataView(buf.buffer);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) buf[o + i] = t.charCodeAt(i); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true);
  v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); str(36, 'data'); v.setUint32(40, n, true);
  buf.fill(128, 44);
  let bin = ''; for (const c of buf) bin += String.fromCharCode(c);
  return 'data:audio/wav;base64,' + btoa(bin);
}

// Annonceur : voix de synthèse française du navigateur.
const VOICE = {
  ok: typeof speechSynthesis !== 'undefined', v: null, primed: false,
  pick() {
    try {
      const vs = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang));
      this.v = vs.find(v => /thomas|nicolas|paul|male|homme/i.test(v.name)) || vs[0] || null;
    } catch (e) { }
  },
  prime() {
    if (!this.ok || this.primed) return;
    this.primed = true; this.pick();
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { }
  },
  say(t, prio = false) {
    if (!this.ok || G.muted || G.demo) return;
    try {
      if (speechSynthesis.speaking) { if (!prio) return; speechSynthesis.cancel(); }
      const u = new SpeechSynthesisUtterance(t.replace(/…/g, '').toLowerCase());
      u.lang = 'fr-FR'; if (this.v) u.voice = this.v;
      u.rate = 1.2; u.pitch = .8; u.volume = 1;
      speechSynthesis.speak(u);
    } catch (e) { }
  },
  stop() { try { if (this.ok) speechSynthesis.cancel(); } catch (e) { } },
};
if (VOICE.ok) speechSynthesis.onvoiceschanged = () => VOICE.pick();

/* =================================================================
   ENTRÉES : clavier, manette, tactile
   ================================================================= */
const keys = {};
const hits = new Set(); // touches appuyées depuis la dernière lecture, même si déjà relâchées
const prev = { shoot: false, pass: false, shove: false, l: false, r: false, u: false, d: false, ok: false, back: false };
let I = {};
const touch = { joyId: null, jx0: 0, jy0: 0, jx: 0, jy: 0, full: false, btn: { tir: null, passe: null, pousser: null }, hit: new Set() };
const BTN = {
  tir: { x: 872, y: 432, r: 56, att: 'TIR', def: 'CONTRE' },
  passe: { x: 752, y: 476, r: 42, att: 'PASSE', def: 'VOL' },
  pousser: { x: 768, y: 356, r: 38, att: null, def: 'POUSSER' },
};
// Vrai quand l'équipe du joueur humain a le ballon : les boutons tactiles changent de rôle.
function humanAttacking() {
  const t = ball.mode === 'held' ? ball.owner.team : ball.mode === 'pass' ? ball.pass.from.team : -1;
  return t === 0;
}
let taps = [];

addEventListener('keydown', e => {
  AU.init();
  if (e.repeat) { if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); return; }
  keys[e.code] = true; hits.add(e.code);
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  const k = e.key.toLowerCase();
  if (k === 'm') { G.muted = !G.muted; if (G.muted) VOICE.stop(); }
  if (G.scene === 'play' && (k === 'p' || e.code === 'Escape')) {
    if (!G.paused) G.paused = true; else if (k === 'p') G.paused = false; else { G.paused = false; toTitle(); }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.scene === 'play') G.paused = true; });

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}
cv.addEventListener('pointerdown', e => {
  AU.init(); cv.focus();
  const p = toLogical(e);
  if (e.pointerType !== 'mouse') G.touch = true;
  if (G.scene === 'play' && !G.paused && e.pointerType !== 'mouse') {
    for (const k in BTN) {
      const b = BTN[k]; if (!(humanAttacking() ? b.att : b.def)) continue;
      if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 14) { touch.btn[k] = e.pointerId; touch.hit.add(k); cv.setPointerCapture(e.pointerId); return; }
    }
    if (p.x < VW * 0.55 && p.y > 60 && touch.joyId === null) {
      touch.joyId = e.pointerId; touch.jx0 = p.x; touch.jy0 = p.y; touch.jx = 0; touch.jy = 0;
      cv.setPointerCapture(e.pointerId); return;
    }
  }
  taps.push(p);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== touch.joyId) return;
  const p = toLogical(e);
  let dx = (p.x - touch.jx0) / 55, dy = (p.y - touch.jy0) / 55;
  const l = Math.hypot(dx, dy);
  if (l < .15) { dx = dy = 0; } else if (l > 1) { dx /= l; dy /= l; }
  touch.jx = dx; touch.jy = dy; touch.full = l >= .95;
});
function endPointer(e) {
  if (e.pointerId === touch.joyId) { touch.joyId = null; touch.jx = touch.jy = 0; touch.full = false; }
  for (const k in touch.btn) if (touch.btn[k] === e.pointerId) touch.btn[k] = null;
}
cv.addEventListener('pointerup', e => { endPointer(e); AU.init(); });
// Sur téléphone, le son ne peut démarrer qu'au moment où le doigt se relève.
addEventListener('touchend', () => AU.init(), { passive: true });
addEventListener('click', () => AU.init());
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', e => e.preventDefault());

function readInput() {
  const k = c => keys[c] || hits.has(c);
  let mx = 0, my = 0;
  if (k('ArrowLeft') || k('KeyA')) mx -= 1;
  if (k('ArrowRight') || k('KeyD')) mx += 1;
  if (k('ArrowUp') || k('KeyW')) my -= 1;
  if (k('ArrowDown') || k('KeyS')) my += 1;
  let shoot = !!(k('Space') || k('KeyJ')), pass = !!k('KeyK'), turbo = !!(k('ShiftLeft') || k('ShiftRight') || k('KeyL'));
  let ok = !!(k('Enter') || k('Space') || k('KeyJ')), back = !!k('Escape');
  hits.clear();
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of pads) {
    if (!gp) continue;
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (Math.abs(ax) > .25) mx += ax; if (Math.abs(ay) > .25) my += ay;
    const B = i => gp.buttons[i] && gp.buttons[i].pressed;
    if (B(14)) mx -= 1; if (B(15)) mx += 1; if (B(12)) my -= 1; if (B(13)) my += 1;
    if (B(0)) { shoot = true; ok = true; }
    if (B(2) || B(1)) pass = true;
    if (B(5) || B(7) || B(4) || B(6)) turbo = true;
    if (B(9)) ok = true;
    if (B(8)) back = true;
  }
  if (touch.joyId !== null) { mx += touch.jx; my += touch.jy; }
  // touch.hit garde un appui bref même si le doigt est déjà relevé
  if (touch.btn.tir !== null || touch.hit.has('tir')) shoot = true;
  if (touch.btn.passe !== null || touch.hit.has('passe')) pass = true;
  if (touch.joyId !== null && touch.full) turbo = true;
  const shove = touch.btn.pousser !== null || touch.hit.has('pousser') || (pass && turbo && touch.btn.passe === null && !touch.hit.has('passe'));
  touch.hit.clear();
  mx = clamp(mx, -1, 1); my = clamp(my, -1, 1);
  const l = mx < -.5, r = mx > .5, u = my < -.5, d = my > .5;
  I = {
    mx, my, shoot, pass, turbo,
    shootPressed: shoot && !prev.shoot, shootReleased: !shoot && prev.shoot, passPressed: pass && !prev.pass, shovePressed: shove && !prev.shove,
    left: l && !prev.l, right: r && !prev.r, up: u && !prev.u, down: d && !prev.d,
    ok: ok && !prev.ok, back: back && !prev.back, taps,
  };
  Object.assign(prev, { shoot, pass, shove, l, r, u, d, ok, back });
  taps = [];
}

/* =================================================================
   JOUEURS
   ================================================================= */
function mkPlayer(def, team, idx, human) {
  return {
    def, team, idx, human, x: 550, y: 250, z: 0, vx: 0, vy: 0, vz: 0, face: tdir(team),
    state: 'run', anim: 0, turbo: 100, usingTurbo: false, streak: 0, fire: false, fireCount: 0,
    stealCd: 0, noPick: 0, reach: 0, downT: 0, hangT: 0, aiT: 0, aiTurbo: false, relAt: 0, shotId: 0, lastBlockTry: -1,
    dk: null, speed: 2.6 + def.vitesse * 0.16, sq: 0, plan: 'drive', spotA: 0,
    stats: { pts: 0, trois: 0, dunks: 0, inter: 0, contres: 0 },
  };
}
const mateOf = p => G.players.find(q => q.team === p.team && q !== p);
const oppsOf = p => G.players.filter(q => q.team !== p.team);
const lvl = p => (p.team === 1 && !G.demo) ? DIFF[G.diff] : (p.team === 1 ? DIFF[1] : MATE);
function nearestOpp(p) {
  let best = null, bd = 1e9;
  for (const q of oppsOf(p)) { const d = dxy(p, q); if (d < bd) { bd = d; best = q; } }
  return { p: best, d: bd };
}

function move(p, mx, my, turbo) {
  if (p.state !== 'run') return;
  const len = Math.hypot(mx, my); if (len > 1) { mx /= len; my /= len; }
  const useT = turbo && (p.turbo > 0 || p.fire) && len > .1;
  let sp = p.speed * (useT ? 1.45 : 1);
  if (ball.owner === p) sp *= .93;
  const v = Math.hypot(p.vx, p.vy);
  if (len > .5 && v > 2 && (p.vx * mx + p.vy * my) / (v * len) < -.3 && G.frame - p.sq > 25 && (p.human || Math.random() < .3)) { p.sq = G.frame; AU.squeak(); }
  p.vx = lerp(p.vx, mx * sp, .3);
  p.vy = lerp(p.vy, my * sp * .82, .3);
  if (useT) { p.usingTurbo = true; if (!p.fire) p.turbo = Math.max(0, p.turbo - .65); }
  if (Math.abs(mx) > .2) p.face = Math.sign(mx);
}

function startJump(p) {
  if (p.state !== 'run') return;
  p.state = 'air'; p.vz = 7.6; p.vx *= .5; p.vy *= .5;
}
function startJumpShot(p) {
  if (p.state !== 'run' || ball.owner !== p) return;
  p.state = 'jumpshot'; p.vz = 7.2; p.vx *= .3; p.vy *= .3;
  p.face = tdir(p.team); p.relAt = rnd(-1.2, 1); p.shotId = G.nextShotId++; p.wantRelease = false;
}
function canDunk(p) { return p.state === 'run' && dxy(p, attHoop(p.team)) < 260; }
function startDunk(p) {
  const h = attHoop(p.team), dr = tdir(p.team), d = dxy(p, h);
  p.state = 'dunk'; p.face = dr; p.shotId = G.nextShotId++;
  p.dk = { x0: p.x, y0: p.y, tx: h.x - dr * 14, ty: h.y, u: 0, T: 28 + d * .09, peak: 60 + rnd(0, 30) + p.def.dunk * 3, checked: false };
  if (!p.fire) p.turbo = Math.max(0, p.turbo - 20);
  AU.tone(300, .3, 'sawtooth', .05, 600);
}

function shotProb(p, d, timing) {
  const st = p.def; let pr;
  if (d < 110) pr = .78 + st.tir * .012;
  else if (d < R3) pr = .66 - (d - 110) / (R3 - 110) * .2 + (st.tir - 5) * .03;
  else pr = .4 - (d - R3) / 200 * .3 + (st.trois - 5) * .035;
  pr *= timing;
  const nd = nearestOpp(p).d; if (nd < 60) pr -= .22 * (1 - nd / 60);
  pr += lvl(p).shot;
  if (p.fire) pr = Math.max(pr, .9);
  return clamp(pr, .03, .97);
}

function releaseShot(p) {
  if (ball.owner !== p || ball.mode !== 'held') { p.state = 'air'; return; }
  const h = attHoop(p.team), d = dxy(p, h);
  const timing = 1 - Math.min(1, Math.abs(p.vz) / 5) * .45;
  const prob = shotProb(p, d, timing);
  const pts = d > R3 ? 3 : 2;
  ball.mode = 'shot'; ball.owner = null;
  ball.shot = { x0: ball.x, y0: ball.y, z0: ball.z, tx: h.x, ty: h.y, tz: RIM_Z + 3, u: 0,
    T: 28 + d * .07, H: 30 + d * .25, make: Math.random() < prob, pts, shooter: p, hoop: h, checked: new Set() };
  p.state = 'air'; p.noPick = 15;
}

function gain(p) {
  ball.mode = 'held'; ball.owner = p; ball.pass = null; ball.shot = null; ball.through = false;
  if (p.team !== G.poss || ball.fromShot) G.shotClock = 24;
  G.poss = p.team; ball.fromShot = false;
  choosePlan(p);
}
// Ce que l'IA veut faire de la balle : pénétrer, tirer à mi-distance ou à 3 points.
function choosePlan(p) {
  const s = p.def, w = [s.dunk + s.vitesse * .5, s.tir * 1.2, s.trois * 1.1 + (p.fire ? 6 : 0)];
  let r = Math.random() * (w[0] + w[1] + w[2]);
  p.plan = r < w[0] ? 'drive' : (r < w[0] + w[1] ? 'mid' : 'three');
  p.spotA = rnd(-1.1, 1.1);
}

function looseBall(vx, vy, vz) {
  ball.mode = 'loose'; ball.owner = null; ball.shot = null; ball.pass = null;
  ball.vx = vx; ball.vy = vy; ball.vz = vz;
}

function rimBounce(h, team) {
  const dr = tdir(team);
  ball.x = h.x - dr * RIM_R; ball.y = h.y; ball.z = RIM_Z + 2;
  looseBall(-dr * rnd(1.5, 4.5), rnd(-3, 3), rnd(3, 7));
  ball.fromShot = true; G.shotClock = 24; AU.rim();
}

function passBall(from, to) {
  if (!to || to.state === 'down' || ball.owner !== from || ball.mode !== 'held') return;
  ball.mode = 'pass'; ball.owner = null;
  ball.pass = { from, to, sp: 12, t: 0, checked: new Set() };
  from.noPick = 12; AU.pass();
}

const STEAL_R = 38, SHOVE_R = 48;
// Vol : bien plus facile du côté où l'adversaire dribble.
function trySteal(p) {
  if (p.stealCd > 0) return;
  p.stealCd = p.human ? 18 : 28; p.reach = 14;
  const h = ball.owner;
  if (!h || h.team === p.team || ball.mode !== 'held' || h.state !== 'run' || dxy(p, h) > STEAL_R) { AU.whiff(); return; }
  const front = (p.x - h.x) * h.face > -4;
  p.face = Math.sign(h.x - p.x) || p.face;
  if (Math.random() < (front ? .5 : .2) + p.def.defense * .02 - h.def.vitesse * .012) {
    gain(p); h.noPick = 30; p.stats.inter++; G.hitstop = 4;
    for (let i = 0; i < 10; i++) spawn(ball.x, ball.y, ball.z + 10, rnd(-3, 3), rnd(-2, 2), rnd(0, 4), 22, pick(['#ffd23f', '#fff']), rnd(2, 4));
    announce(pick(['INTERCEPTION !', 'VOLÉ !', 'QUELLES MAINS !']), '#ffd23f', 60, true); AU.steal();
  } else AU.whiff();
}
// Bousculade : vise le porteur du ballon en priorité, avec un élan visible.
function tryShove(p) {
  if (p.stealCd > 0 || (p.turbo < 15 && !p.fire)) return;
  p.stealCd = 36; p.reach = 16; if (!p.fire) p.turbo -= 15;
  const ok = q => q.team !== p.team && q.state !== 'down' && q.state !== 'dunk' && q.state !== 'hang';
  const h = ball.mode === 'held' ? ball.owner : null;
  let tgt = null;
  if (h && ok(h) && dxy(p, h) < SHOVE_R) tgt = h;
  else { let bd = SHOVE_R - 6; for (const q of oppsOf(p)) if (ok(q) && dxy(p, q) < bd) { bd = dxy(p, q); tgt = q; } }
  const fx = tgt ? tgt.x - p.x : p.face, fy = tgt ? tgt.y - p.y : 0, fd = Math.max(1, Math.hypot(fx, fy)), nx = fx / fd, ny = fy / fd;
  p.vx += nx * 5; p.vy += ny * 4; if (Math.abs(nx) > .2) p.face = Math.sign(nx);
  if (!tgt) { AU.whiff(); return; }
  knockDown(tgt, nx, ny); G.hitstop = 5;
  for (let i = 0; i < 12; i++) spawn(tgt.x, tgt.y, 45, rnd(-4, 4), rnd(-2, 2), rnd(-2, 4), 20, pick(['#fff', '#ffd23f', '#ff8a3d']), rnd(2, 5));
  announce(pick(['BOUSCULADE !', 'ÇA DÉMÉNAGE !', 'AU TAPIS !']), '#ff8a3d', 60, true);
}
function knockDown(q, nx, ny) {
  if (ball.owner === q) { looseBall(nx * 3 + rnd(-1, 1), ny * 3 + rnd(-1, 1), 4); }
  q.state = 'down'; q.downT = q.human && !G.demo ? 45 : 70; q.vx = nx * 7; q.vy = ny * 5; q.z = 0; q.vz = 0; q.noPick = 60;
  AU.shove(); G.shake = 6;
}

/* ---------- contrôle humain ---------- */
function humanControl(p) {
  const mate = mateOf(p);
  move(p, I.mx, I.my, I.turbo);
  if (p.state === 'jumpshot') {
    // Relâché avant le sommet : le tir part au sommet. Trop tard : il part quand même, moins précis.
    if (!I.shoot) p.wantRelease = true;
    if ((p.wantRelease && p.vz <= .6) || p.vz < -5.5) releaseShot(p);
    return;
  }
  if (p.state !== 'run') return;
  const held = ball.mode === 'held';
  if (held && ball.owner === p) {
    if (I.shootPressed) { if (canDunk(p) && (I.turbo || dxy(p, attHoop(p.team)) < 150)) startDunk(p); else startJumpShot(p); }
    else if (I.passPressed) passBall(p, mate);
  } else if (held && ball.owner === mate) {
    if (I.passPressed) passBall(mate, p);
    else if (I.shootPressed && mate.state === 'run') {
      if (canDunk(mate) && (mate.turbo > 20 || mate.fire)) startDunk(mate); else startJumpShot(mate);
    }
  } else {
    if (I.shootPressed) startJump(p);
    if (I.shovePressed) tryShove(p);
    else if (I.passPressed) trySteal(p);
  }
}

/* ---------- IA ---------- */
function aiControl(p) {
  if (p.state === 'jumpshot') { if (p.vz <= p.relAt) releaseShot(p); return; }
  if (p.state !== 'run') return;
  const L = lvl(p), h = attHoop(p.team), dr = tdir(p.team), mate = mateOf(p), opps = oppsOf(p);
  const holder = ball.mode === 'held' ? ball.owner : null;
  let tx = p.x, ty = p.y, turbo = false;

  if (G.pending) {
    const t = setupTargets(G.pending.team)[G.players.indexOf(p)];
    tx = t.x; ty = t.y; turbo = dxy(p, t) > 200;
  } else if (holder === p) {
    const d = dxy(p, h), no = nearestOpp(p), open = no.d > 55;
    if (--p.aiT <= 0) {
      p.aiT = 8 + Math.random() * 10;
      p.aiTurbo = (p.turbo > 35 || p.fire) && Math.random() < .5 * L.agg;
      const mateOpen = mate.state === 'run' && nearestOpp(mate).d > 70;
      if (G.shotClock < 3 || (G.clock < 2.5 && G.clock > 0)) { startJumpShot(p); return; }
      if (p.plan === 'drive') {
        if (d < 200 && (p.turbo > 20 || p.fire) && Math.random() < .14 * L.agg + p.def.dunk * .014) { startDunk(p); return; }
        if (d < 120 && Math.random() < .3) { startJumpShot(p); return; }
      } else {
        const want = p.plan === 'three' ? R3 + 18 : 165;
        if (Math.abs(d - want) < 30 && (open || Math.random() < .3)) { startJumpShot(p); return; }
      }
      if (no.d < 35 && Math.random() < .22) { passBall(p, mate); return; }
      if (mateOpen && Math.random() < .06) { passBall(p, mate); return; }
      if (G.shotClock < 12 && p.plan !== 'drive' && Math.random() < .3) p.plan = 'drive';
    }
    if (p.plan === 'drive') {
      tx = h.x - dr * 60;
      ty = h.y + Math.sin(G.frame / 45 + p.idx * 2) * 130;
    } else {
      const want = p.plan === 'three' ? R3 + 18 : 165;
      tx = h.x - dr * Math.cos(p.spotA) * want; ty = h.y + Math.sin(p.spotA) * want;
    }
    if (no.p && no.d < 70 && (no.p.x - p.x) * dr > 0) ty = p.y + Math.sign(p.y - no.p.y || 1) * 90;
    ty = clamp(ty, 60, 440); turbo = p.aiTurbo;
  } else if (holder && holder.team === p.team) {
    if ((G.frame + p.idx * 120) % 300 < 70) { tx = h.x - dr * 80; ty = h.y + 40; }
    else { tx = h.x - dr * 210; ty = holder.y > 250 ? 110 : 390; }
    turbo = dxy(p, { x: tx, y: ty }) > 150;
  } else if (ball.mode === 'loose' || ball.mode === 'shot') {
    if (ball.mode === 'shot') {
      const s = ball.shot, sd = tdir(s.shooter.team);
      tx = s.hoop.x - sd * (s.shooter.team === p.team ? 95 : 60);
      ty = s.hoop.y + (p.idx ? -55 : 55);
      if (s.shooter.team !== p.team && s.u < .3 && dxy(p, ball) < 60 && p.lastBlockTry !== s.shooter.shotId) {
        p.lastBlockTry = s.shooter.shotId; if (Math.random() < L.block * .5) startJump(p);
      }
    } else {
      const tgt = { x: ball.x + ball.vx * 8, y: ball.y + ball.vy * 8 };
      const iAmClosest = dxy(p, ball) <= dxy(mate, ball) + 5;
      if (iAmClosest || dxy(p, ball) < 90) { tx = tgt.x; ty = tgt.y; turbo = true; }
      else { const ho = attHoop(1 - p.team); tx = lerp(ball.x, ho.x, .4); ty = 250; }
      if (ball.z > 45 && ball.z < 150 && ball.vz < 0 && dxy(p, ball) < 45 && Math.random() < .12) startJump(p);
    }
  } else if (ball.mode === 'pass' && ball.pass.from.team === p.team) {
    tx = h.x - dr * 200; ty = p.y;
  } else {
    const defHoop = attHoop(1 - p.team);
    const man = opps.find(q => q.idx === p.idx) || opps[0];
    const carrier = holder || (ball.pass ? ball.pass.to : man);
    const mine = carrier === man || (carrier && dxy(carrier, defHoop) < 220 && dxy(p, carrier) < dxy(mate, carrier));
    const tgt = mine ? carrier : man;
    const gd = Math.max(1, dxy(tgt, defHoop));
    const off = mine ? 46 : 54;
    tx = tgt.x + (defHoop.x - tgt.x) / gd * off; ty = tgt.y + (defHoop.y - tgt.y) / gd * off;
    turbo = dxy(p, { x: tx, y: ty }) > 110;
    if (holder && mine) {
      const d = dxy(p, holder);
      if ((holder.state === 'jumpshot' || holder.state === 'dunk') && d < (holder.state === 'dunk' ? 130 : 70) && p.lastBlockTry !== holder.shotId) {
        p.lastBlockTry = holder.shotId; if (Math.random() < L.block) startJump(p);
      } else if (d < STEAL_R && holder.state === 'run') {
        if (Math.random() < L.steal) trySteal(p);
        else if ((p.turbo > 40 || p.fire) && Math.random() < L.shove) tryShove(p);
      }
    }
  }
  const dx = tx - p.x, dy = ty - p.y, dd = Math.hypot(dx, dy);
  if (dd < 6) move(p, 0, 0, false);
  else { const k = Math.min(1, dd / 40); move(p, dx / dd * k, dy / dd * k, turbo); }
}

/* ---------- mise à jour des joueurs ---------- */
function updatePlayer(p) {
  if (p.stealCd > 0) p.stealCd--; if (p.noPick > 0) p.noPick--; if (p.reach > 0) p.reach--;
  p.usingTurbo = false;
  if (p.state === 'down') {
    p.downT--; p.vx *= .88; p.vy *= .88; if (p.downT <= 0) p.state = 'run';
  } else if (p.state === 'dunk') { updateDunk(p); }
  else if (p.state === 'hang') { p.hangT--; if (p.hangT <= 0) { p.state = 'air'; p.vz = 0; } }
  else if (p.human && !G.demo) humanControl(p);
  else aiControl(p);

  if (p.state !== 'dunk' && p.state !== 'hang') {
    p.x += p.vx; p.y += p.vy;
    if (p.state === 'air' || p.state === 'jumpshot') {
      p.z += p.vz; p.vz -= GRAV;
      if (p.z <= 0) {
        p.z = 0; p.vz = 0;
        if (p.state === 'jumpshot') releaseShot(p);
        p.state = 'run';
      }
    }
  }
  p.x = clamp(p.x, 10, W - 10); p.y = clamp(p.y, 10, D - 10);
  if (p.fire) p.turbo = 100;
  else if (!p.usingTurbo) p.turbo = Math.min(100, p.turbo + .3);
  p.anim += Math.hypot(p.vx, p.vy) * .085;
  if (p.fire && G.frame % 2 === 0) spawn(p.x + rnd(-8, 8), p.y + 1, p.z + rnd(5, 60), rnd(-.3, .3), 0, rnd(.8, 1.8), 24, pick(['#ff6a00', '#ffb300', '#ff3d00', '#ffe066']), rnd(3, 6));
}

function updateDunk(p) {
  const k = p.dk; k.u += 1 / k.T; const u = Math.min(1, k.u);
  p.x = lerp(k.x0, k.tx, u); p.y = lerp(k.y0, k.ty, u);
  p.z = 4 * u * (1 - u) * k.peak + u * 22;
  if (!k.checked && u > .35 && u < .8) {
    for (const o of oppsOf(p)) {
      if (o.z > 20 && dxy(o, p) < 45 && Math.abs(o.z - p.z) < 70) {
        k.checked = true;
        if (Math.random() < .12 + o.def.defense * .025) {
          looseBall(-tdir(p.team) * rnd(3, 5), rnd(-3, 3), 3);
          p.state = 'air'; p.vz = 0; o.stats.contres++;
          announce('CONTRÉ !', '#7fd4ff', 60, true); AU.block(); G.shake = 5; G.hitstop = 5; return;
        }
      }
    }
  }
  if (u >= 1) {
    const h = attHoop(p.team);
    if (Math.random() < (p.fire ? .99 : .8 + p.def.dunk * .018)) {
      ball.x = h.x; ball.y = h.y; ball.z = RIM_Z - 4;
      looseBall(0, 0, -3); ball.through = true;
      p.stats.dunks++;
      score(p, 2, 'dunk');
      p.state = 'hang'; p.hangT = 20; p.z = 22;
      G.shake = 12; G.hitstop = 8; AU.dunk();
      for (let i = 0; i < 26; i++) spawn(h.x, h.y, RIM_Z, rnd(-5, 5), rnd(-3, 3), rnd(-2, 5), 35, pick(['#fff', CONFIG.club.couleur, '#ffd23f']), rnd(2, 5));
    } else {
      rimBounce(h, p.team); p.state = 'air'; p.vz = 1;
      announce('SUR LE CERCLE !', '#ddd', 48);
    }
  }
}

/* ---------- ballon ---------- */
function ballHandPos(p) {
  const f = p.face;
  if (p.state === 'jumpshot' || p.state === 'dunk' || p.state === 'hang')
    return { x: p.x + f * 5, y: p.y + 1, z: p.z + 80 };
  if (p.state === 'air') return { x: p.x + f * 8, y: p.y + 1, z: p.z + 45 };
  const bz = 5 + Math.abs(Math.sin(G.frame * .16 + p.idx)) * 30;
  return { x: p.x + f * 13, y: p.y + 3, z: p.state === 'down' ? 0 : bz };
}

function updateBall() {
  const b = ball;
  if (b.mode === 'held') {
    const o = b.owner, h = ballHandPos(o); b.x = h.x; b.y = h.y; b.z = h.z;
    if (o.state === 'run') { const sn = Math.sin(G.frame * .16 + o.idx) >= 0; if (b.dsn !== undefined && sn !== b.dsn) AU.dribble(o.human ? .13 : .06); b.dsn = sn; }
    return;
  }
  if (b.mode === 'shot') {
    const s = b.shot; s.u += 1 / s.T; const u = Math.min(1, s.u);
    b.x = lerp(s.x0, s.tx, u); b.y = lerp(s.y0, s.ty, u);
    b.z = lerp(s.z0, s.tz, u) + s.H * 4 * u * (1 - u);
    if (u < .35) {
      for (const o of oppsOf(s.shooter)) {
        if (s.checked.has(o) || o.z < 15 || dxy(o, b) > 38 || o.z + 100 < b.z) continue;
        s.checked.add(o);
        if (Math.random() < .15 + o.def.defense * .03) {
          looseBall(-tdir(s.shooter.team) * rnd(3, 6), rnd(-3, 3), rnd(2, 5));
          o.stats.contres++; announce(pick(['CONTRÉ !', 'REFUSÉ !', 'PAS CHEZ MOI !']), '#7fd4ff', 60, true); AU.block(); G.shake = 4; G.hitstop = 5;
          return;
        }
      }
    }
    if (u >= 1) {
      if (s.make) {
        b.x = s.tx; b.y = s.ty; b.z = RIM_Z - 2; looseBall(0, 0, -2.5); b.through = true;
        AU.swish(); score(s.shooter, s.pts, 'shot');
      } else rimBounce(s.hoop, s.shooter.team);
    }
    return;
  }
  if (b.mode === 'pass') {
    const ps = b.pass, to = ps.to; ps.t++;
    const dx = to.x - b.x, dy = to.y - b.y, d = Math.max(.01, Math.hypot(dx, dy));
    if (d <= ps.sp + 4 && to.state !== 'down') { gain(to); return; }
    b.x += dx / d * ps.sp; b.y += dy / d * ps.sp; b.z = lerp(b.z, to.z + 48, .15);
    for (const o of oppsOf(ps.from)) {
      if (ps.checked.has(o) || o.state === 'down' || dxy(o, b) > 24 || b.z > o.z + 100) continue;
      ps.checked.add(o);
      if (Math.random() < (.12 + o.def.defense * .02) * lvl(o).inter) {
        gain(o); o.stats.inter++; announce('INTERCEPTÉ !', '#ffd23f', 60, true); AU.steal(); G.hitstop = 4; return;
      }
    }
    if (ps.t > 80) looseBall(dx / d * 3, dy / d * 3, 0);
    return;
  }
  // ballon libre
  b.vz -= BGRAV; b.x += b.vx; b.y += b.vy; b.z += b.vz;
  if (b.z <= 0) {
    b.z = 0; b.through = false;
    if (b.vz < -1.4) { b.vz = -b.vz * .62; AU.bounce(); } else b.vz = 0;
    b.vx *= .86; b.vy *= .86;
  }
  if (b.x < 4 || b.x > W - 4) { b.vx *= -.6; b.x = clamp(b.x, 4, W - 4); }
  if (b.y < 4 || b.y > D - 4) { b.vy *= -.6; b.y = clamp(b.y, 4, D - 4); }
  if (G.pending || b.through) return;
  let best = null, bd = 26;
  for (const p of G.players) {
    if (p.state === 'down' || p.state === 'dunk' || p.state === 'hang' || p.noPick > 0) continue;
    const d = dxy(p, b);
    if (d < bd && b.z < p.z + 100 && b.z > p.z - 20) { bd = d; best = p; }
  }
  if (best) gain(best);
}

/* ---------- score, "en feu" ---------- */
function score(p, pts, kind) {
  const t = p.team;
  G.score[t] += pts; p.stats.pts += pts; if (pts === 3) p.stats.trois++;
  for (const q of G.players) if (q.team !== t) {
    if (q.fire) announce('FEU ÉTEINT…', '#aaa', 40);
    q.streak = 0; q.fire = false;
  }
  p.streak++;
  if (p.fire) { if (++p.fireCount >= 4) { p.fire = false; p.streak = 0; } }
  else if (p.streak >= 3) { p.fire = true; p.fireCount = 0; }

  const fireNow = p.fire && p.fireCount === 0;
  if (kind === 'dunk') announce(pick(['QUEL DUNK !', 'TOMAHAWK !', 'MOULIN À VENT !', 'DANS TA FACE !', 'LE CERCEAU TREMBLE !', 'ATOMIQUE !']), '#fff', 70, !fireNow);
  else if (pts === 3) { announce(pick(['À TROIS POINTS !', 'DE LOIN !', 'DEPUIS LE PARKING !']), '#ffd23f', 66, !fireNow); AU.three(); }
  else { announce(pick(['PANIER !', 'DU FILET !', 'DEDANS !', 'TOUT EN DOUCEUR !']), '#fff', 56, !fireNow && Math.random() < .35); AU.score2(); }
  if (fireNow) { announce(p.def.prenom.toUpperCase() + ' EST EN FEU !', '#ff6a00', 64, true, true); AU.fire(); }
  else if (!p.fire && p.streak === 2) announce('ÇA CHAUFFE…', '#ffb300', 44);

  G.hype = 1;
  G.pending = { team: 1 - t, t: 75 };
}

function setupTargets(team) {
  const o = team, dO = tdir(o), own = attHoop(1 - o);
  const res = [];
  for (const p of G.players) {
    if (p.team === o) res.push(p.idx === 0 ? { x: own.x + dO * 90, y: 250 } : { x: own.x + dO * 230, y: 120 });
    else res.push(p.idx === 0 ? { x: 550 + dO * 140, y: 200 } : { x: 550 + dO * 180, y: 330 });
  }
  return res;
}
function setupPossession(team, kind) {
  const tg = kind === 'start' ? null : setupTargets(team);
  G.players.forEach((p, i) => {
    if (tg) { p.x = tg[i].x; p.y = tg[i].y; }
    else {
      const side = p.team === team ? -1 : 1, dO = tdir(team);
      p.x = 550 + side * dO * (p.idx ? 120 : 40); p.y = p.idx ? 140 : 330;
    }
    p.z = 0; p.vx = p.vy = p.vz = 0; p.state = 'run'; p.face = tdir(p.team); p.noPick = 0;
  });
  const handler = G.players.find(p => p.team === team && p.idx === 0);
  G.poss = team; gain(handler); G.shotClock = 24;
  ball.vx = ball.vy = ball.vz = 0;
}

/* =================================================================
   PARTIE
   ================================================================= */
function newGame(sel, demo) {
  G.demo = demo;
  const home = sel.map(i => CONFIG.joueurs[i]);
  const away = [...CONFIG.adversaire.joueurs].sort(() => Math.random() - .5).slice(0, 2);
  G.players = [mkPlayer(home[0], 0, 0, !demo), mkPlayer(home[1], 0, 1, false), mkPlayer(away[0], 1, 0, false), mkPlayer(away[1], 1, 1, false)];
  G.score = [0, 0]; G.quarter = 1; G.clock = demo ? 60 : CONFIG.dureeQuartTemps;
  G.pending = null; G.ann = []; G.parts = []; G.over = null; G.paused = false; G.hype = 0;
  setupPossession(Math.random() < .5 ? 0 : 1, 'start');
  G.camX = 550;
}
function randomDuo() {
  const n = CONFIG.joueurs.length, a = Math.floor(Math.random() * n);
  let b = Math.floor(Math.random() * (n - 1)); if (b >= a) b++;
  return [a, b];
}
function toTitle() { G.scene = 'title'; newGame(randomDuo(), true); }

function quarterName(q) {
  if (q > 4) return q === 5 ? 'PROLONGATION' : 'PROLONGATION ' + (q - 4);
  return q === 1 ? '1er QUART-TEMPS' : q + 'e QUART-TEMPS';
}
function endQuarter() {
  AU.buzzer();
  if (G.quarter >= 4 && G.score[0] !== G.score[1]) {
    if (G.demo) { newGame(randomDuo(), true); return; }
    G.over = { win: G.score[0] > G.score[1] }; G.scene = 'over';
    AU.roar(.5, 3); VOICE.say(G.over.win ? 'Victoire !' : 'Défaite…', true); return;
  }
  G.breakMsg = G.quarter === 2 ? 'MI-TEMPS' : 'FIN DU ' + quarterName(G.quarter);
  G.quarter++;
  G.clock = G.quarter > 4 ? 60 : (G.demo ? 60 : CONFIG.dureeQuartTemps);
  G.breakT = G.demo ? 60 : 150; G.scene = G.demo ? 'title' : 'break';
  if (!G.demo) VOICE.say(G.breakMsg, true);
  if (G.demo) setupPossession(G.quarter % 2, 'start');
}

function updatePlay() {
  if (G.hitstop > 0) { G.hitstop--; return; } // arrêt sur image après un gros choc
  G.frame++;
  if (G.pending) { if (--G.pending.t <= 0) { const t = G.pending.team; G.pending = null; setupPossession(t, 'inbound'); } }
  else {
    G.clock = Math.max(0, G.clock - 1 / 60); G.shotClock -= 1 / 60;
    const sc = Math.ceil(G.shotClock);
    if (sc <= 5 && sc > 0 && sc !== G.lastBeep && ball.mode !== 'shot') { G.lastBeep = sc; AU.beep(); }
    if (sc > 5) G.lastBeep = 0;
  }
  for (const p of G.players) updatePlayer(p);
  for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) {
    const a = G.players[i], b = G.players[j];
    if (a.state === 'dunk' || b.state === 'dunk' || a.state === 'down' || b.state === 'down') continue;
    const d = dxy(a, b);
    if (d < 36 && d > .01) { const k = (36 - d) / d * .3; a.x -= (b.x - a.x) * k; a.y -= (b.y - a.y) * k; b.x += (b.x - a.x) * k; b.y += (b.y - a.y) * k; }
  }
  updateBall();
  if (!G.pending && G.shotClock <= 0 && ball.mode !== 'shot') {
    announce('24 SECONDES !', '#ff5252', 54, true); AU.buzzer();
    setupPossession(1 - G.poss, 'inbound');
  }
  if (G.clock <= 0 && ball.mode !== 'shot' && !(ball.owner && ball.owner.state === 'dunk')) {
    if (G.pending) { const t = G.pending.team; G.pending = null; setupPossession(t, 'inbound'); }
    endQuarter();
  }
  const tgt = ball.owner ? ball.x + tdir(ball.owner.team) * 70 : ball.x;
  let cx = tgt;
  const me = G.players.find(p => p.human && !G.demo);
  if (me) {
    // garde le joueur humain entre x=110 et le bord des boutons tactiles (ou 850 au clavier)
    const s = sc(me.y), hi = G.touch ? 680 : 850;
    cx = clamp(cx, me.x - (hi - 480) / s, me.x + 370 / s);
  }
  G.camX += (clamp(cx, 317, 783) - G.camX) * .08;
  G.hype *= .985;
  // le joueur humain en défense est-il assez près du porteur pour voler ou bousculer ?
  G.inRange = null;
  if (me && me.state === 'run' && ball.mode === 'held' && ball.owner.team !== me.team) {
    const d = dxy(me, ball.owner);
    if (d < SHOVE_R) G.inRange = { target: ball.owner, steal: d < STEAL_R };
  }
}

function update() {
  readInput();
  updateParts();
  for (const a of G.ann) a.t++;
  G.ann = G.ann.filter(a => a.t < a.life);
  if (G.shake > 0) G.shake *= .85;
  if (G.frame % 6 === 0) AU.crowdLevel();

  if (G.scene === 'title') {
    updatePlay();
    if (I.left) { G.diff = (G.diff + 2) % 3; AU.blip(); }
    if (I.right) { G.diff = (G.diff + 1) % 3; AU.blip(); }
    for (const t of I.taps) {
      if (t.y > 345 && t.y < 395 && t.x > 330 && t.x < 630) { G.diff = (G.diff + (t.x < 480 ? 2 : 1)) % 3; AU.blip(); }
      else { goSelect(); return; }
    }
    if (I.ok) goSelect();
  } else if (G.scene === 'select') updateSelect();
  else if (G.scene === 'play') {
    for (const t of I.taps) {
      if (G.paused) { if (t.y > 300 && t.y < 350 && t.x > 380 && t.x < 580) { G.paused = false; toTitle(); return; } G.paused = false; }
      else if (t.y < 50 && t.x > 375 && t.x < 455) G.paused = true;
      else if (t.y > VH - 40 && Math.abs(t.x - 480) < 50) { G.muted = !G.muted; if (G.muted) VOICE.stop(); }
    }
    if (!G.paused) updatePlay();
  } else if (G.scene === 'break') {
    if (--G.breakT <= 0 || (I.ok && G.breakT < 120)) { setupPossession((G.quarter + 1) % 2, 'start'); G.ann = []; announce(quarterName(G.quarter), '#fff', 54); G.scene = 'play'; }
  } else if (G.scene === 'over') {
    G.frame++;
    if (I.ok || I.taps.length) { newGame(G.sel, false); G.scene = 'play'; announce("C'EST REPARTI !", '#fff', 60); }
    if (I.back) toTitle();
  }
}

/* ---------- écran de sélection ---------- */
function goSelect() { G.scene = 'select'; G.sel = []; G.cur = 0; AU.blip(); }
function selectLayout() {
  const n = CONFIG.joueurs.length, cols = 4, rows = Math.ceil(n / cols);
  const ch = Math.min(150, (320 / rows) - 12), cw = 205;
  const out = [];
  for (let i = 0; i < n; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    out.push({ x: 480 - (cols * (cw + 14) - 14) / 2 + c * (cw + 14), y: 100 + r * (ch + 12), w: cw, h: ch });
  }
  return out;
}
const PLAY_BTN = { x: 370, y: 455, w: 220, h: 54 };
function toggleSel(i) {
  const k = G.sel.indexOf(i);
  if (k >= 0) G.sel.splice(k, 1); else if (G.sel.length < 2) G.sel.push(i); else { G.sel[1] = i; }
  AU.blip();
}
function startGame() {
  if (G.sel.length < 2) return;
  newGame(G.sel, false); G.scene = 'play';
  announce('ENTRE-DEUX !', '#fff', 60, true); AU.buzzer(); AU.roar(.3);
}
function updateSelect() {
  G.frame++;
  const n = CONFIG.joueurs.length;
  if (I.back) { toTitle(); return; }
  if (G.cur === n) { if (I.up) G.cur = n - 1; if (I.ok) { startGame(); return; } }
  else {
    if (I.left) G.cur = Math.max(0, G.cur - 1);
    if (I.right) G.cur = Math.min(n - 1, G.cur + 1);
    if (I.up && G.cur >= 4) G.cur -= 4;
    if (I.down) G.cur = G.cur + 4 < n ? G.cur + 4 : (G.sel.length === 2 ? n : G.cur);
    if (I.ok) { toggleSel(G.cur); if (G.sel.length === 2) G.cur = n; else if (G.sel.length === 1) G.cur = (G.cur + 1) % n; }
  }
  const L = selectLayout();
  for (const t of I.taps) {
    const b = PLAY_BTN;
    if (G.sel.length === 2 && t.x > b.x && t.x < b.x + b.w && t.y > b.y && t.y < b.y + b.h) { startGame(); return; }
    L.forEach((c, i) => { if (t.x > c.x && t.x < c.x + c.w && t.y > c.y && t.y < c.y + c.h) { G.cur = i; toggleSel(i); } });
    if (t.x < 80 && t.y < 60) { toTitle(); return; }
  }
}

/* ---------- annonces & particules ---------- */
function announce(txt, color = '#fff', size = 60, say = false, prio = false) {
  if (say) VOICE.say(txt, prio);
  G.ann.push({ txt, color, size, t: 0, life: 70 });
  if (G.ann.length > 2) G.ann.shift();
}
function spawn(x, y, z, vx, vy, vz, life, color, size) {
  if (G.parts.length > 400) return;
  G.parts.push({ x, y, z, vx, vy, vz, life, max: life, color, size });
}
function updateParts() {
  for (const q of G.parts) { q.x += q.vx; q.y += q.vy; q.z += q.vz; q.life--; }
  G.parts = G.parts.filter(q => q.life > 0);
}

/* =================================================================
   RENDU — le monde est dessiné en basse résolution (480×270)
   puis agrandi sans lissage : de vrais gros pixels.
   ================================================================= */
const PIX = '"Press Start 2P", "Courier New", monospace';
const LS = 1; // le monde est dessiné en pleine résolution
const lo = document.createElement('canvas'); lo.width = VW / LS; lo.height = VH / LS;
const loCtx = lo.getContext('2d');
const shk = { x: 0, y: 0 };
function loVector() { loCtx.setTransform(1 / LS, 0, 0, 1 / LS, shk.x, shk.y); }
function loPixel() { loCtx.setTransform(1, 0, 0, 1, shk.x, shk.y); }

function sc(y) { return 1.15 + .5 * (y / D); }
function P(x, y, z) { const s = sc(y); return { x: VW / 2 + (x - G.camX) * s, y: TOP + y * .55 - z * s, s }; }
function path3(pts, close) {
  ctx.beginPath();
  pts.forEach((q, i) => { const s = P(q[0], q[1], q[2] || 0); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
  if (close) ctx.closePath();
}
function arcPts(cx, cy, r, a0, a1, n = 36) {
  const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } return o;
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// La police pixel n'a pas de majuscules accentuées : on les retire, comme sur les vieilles consoles.
const noAcc = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
// weight 'pix' = police pixel
function txt(s, x, y, size, color, align = 'center', weight = '900', stroke = 0, italic = false) {
  if (weight === 'pix') s = noAcc(s);
  ctx.font = weight === 'pix' ? `${size}px ${PIX}` : `${italic ? 'italic ' : ''}${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = weight === 'pix' ? 'miter' : 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = '#000'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

/* ---------- joueurs : dessin lisse, proportions réalistes, ombrage en dégradé ---------- */
const SU = 1.6;    // pixels écran par unité de corps (un joueur mesure ~72 unités)
const SD = 2;      // densité du canevas de pose, pour rester net sur les écrans de téléphone
const SPR_W = 156, SPR_H = 166, SPR_OX = 78, SPR_OY = 152;
const spriteCache = new Map();
let spriteIds = 0;
function shadeHex(hex, k) {
  let h = hex.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16), f = v => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k));
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => f(v).toString(16).padStart(2, '0')).join('');
}
// Cinématique inverse à deux segments : position du genou ou du coude.
function ik(ax, ay, bx, by, l1, l2, bend) {
  const dx = bx - ax, dy = by - ay; let d = Math.hypot(dx, dy) || .01;
  d = Math.min(d, l1 + l2 - .01);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const n = Math.hypot(dx, dy) || .01, ux = dx / n, uy = dy / n;
  return [ax + ux * a - uy * h * bend, ay + uy * a + ux * h * bend];
}

// Renvoie le canevas de la pose du joueur (dessinée une seule fois, puis réutilisée telle quelle).
function renderSprite(p, b) {
  const tm = G.teams[p.team], f = p.face;
  const down = p.state === 'down';
  const moving = Math.hypot(p.vx, p.vy) > .5 && p.z === 0 && p.state === 'run';
  const ph = moving ? Math.round((((p.anim % 6.2832) + 6.2832) % 6.2832) / .5236) % 12 : -1;
  const a = ph * .5236, sw = moving ? Math.sin(a) : 0;
  const air = p.z > 0 || p.state === 'dunk' || p.state === 'hang';
  const hang = p.state === 'hang';
  const hasBall = ball.mode === 'held' && ball.owner === p;
  const up = p.state === 'jumpshot' || p.state === 'dunk' || hang || (air && hasBall);

  let hb, hf;
  if (up) { hb = [f * 2, -84]; hf = [f * 7, -83]; if (hang) { hb = [f * 8, -82]; hf = [f * 11, -82]; } }
  else if (air) { hb = [-8, -84]; hf = [8, -85]; }
  else if (p.reach > 0) { hb = [-f * 5 - sw * 5, -36]; hf = [f * 26, -48]; }
  else if (hasBall && p.state === 'run' && b) {
    const bp = P(ball.x, ball.y, ball.z), k = sc(p.y) / 1.4;
    hb = [-f * 4 - sw * 6, -35]; hf = [(bp.x - b.x) / SU / k, (bp.y - b.y) / SU / k - 1.5];
  } else { hb = [-f * 3 - sw * 8, -34]; hf = [f * 3 + sw * 8, -34]; }
  hb = hb.map(Math.round); hf = hf.map(Math.round);

  if (!p.def._id) p.def._id = ++spriteIds;
  const key = [p.def._id, p.team, f, down ? 1 : 0, air ? 1 : 0, hang ? 1 : 0, ph, hb, hf].join();
  const hit = spriteCache.get(key); if (hit) return hit;

  const cvs = document.createElement('canvas'); cvs.width = SPR_W * SD; cvs.height = SPR_H * SD;
  const g = cvs.getContext('2d');
  g.scale(SD, SD); g.translate(SPR_OX, SPR_OY);

    jer: tm.couleur, jerL: shadeHex(tm.couleur, .2), jerD: shadeHex(tm.fonce, -.15), trim: tm.clair,
    hair, hairL: shadeHex(hair, .25), line: 'rgba(25,12,12,.6)',

  const poly = (pts, fill, stroke = K.line) => {
    g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(f * q[0], q[1]) : g.moveTo(f * q[0], q[1])); g.closePath();
    g.fillStyle = fill; g.fill(); if (stroke) { g.strokeStyle = stroke; g.lineWidth = .55; g.stroke(); }
  };

    const path = (dx, dy) => { g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0] + dx, q[1] + dy) : g.moveTo(q[0] + dx, q[1] + dy)); };
    path(0, 0); g.strokeStyle = K.line; g.lineWidth = w + .9; g.stroke();
    g.strokeStyle = col; g.lineWidth = w; g.stroke();
    path(-f * w * .22, w * .12); g.strokeStyle = colD; g.lineWidth = w * .42; g.stroke();
    path(f * w * .24, -w * .08); g.strokeStyle = colL; g.lineWidth = w * .26; g.stroke();
  };

  // --- jambes (pieds en coordonnées corps, y négatif vers le haut)
  let fa, fb;
  if (air) { fb = [-f * 4, -7]; fa = [f * 4, -13]; }
  else if (moving) { fa = [f * Math.sin(a) * 9, -Math.max(0, Math.cos(a)) * 4]; fb = [-f * Math.sin(a) * 9, -Math.max(0, -Math.cos(a)) * 4]; }
  else { fa = [f * 3.5, 0]; fb = [-f * 3, 0]; }
  const leg = (hipX, foot, back) => {
    const hx = hipX, hy = -36, kn = ik(hx, hy, foot[0], foot[1] - 3, 17, 16, -f);
    const sk = back ? K.skinB : K.skin;
    limb([[hx, hy], kn, [foot[0], foot[1] - 3]], back ? 5.6 : 6, sk, K.skinL, K.skinD);
    // chaussette et chaussure
    limb([[foot[0], foot[1] - 6.5], [foot[0], foot[1] - 3]], 4.4, back ? '#d9d9d9' : '#f4f4f4', '#fff', '#bdbdbd');
    g.beginPath(); g.ellipse(foot[0] + f * 2, foot[1] - 1.7, 4.9, 2.2, 0, 0, 7);
    g.fillStyle = back ? '#dcdcdc' : '#fafafa'; g.fill(); g.strokeStyle = K.line; g.lineWidth = .55; g.stroke();
    g.fillStyle = '#2a2a2a'; g.fillRect(foot[0] - 2.9 + f * 2 - (f < 0 ? 0 : 0), foot[1] - .7, 9.8, .9);
    g.strokeStyle = K.jer; g.lineWidth = .8; g.beginPath(); g.moveTo(foot[0] - f * .5, foot[1] - 2.2); g.lineTo(foot[0] + f * 3.5, foot[1] - 1.4); g.stroke();
  };
  // --- bras
  const arm = (sx, hand, back) => {
    const sy = -54, el = ik(sx * 1.3, sy, hand[0], hand[1], 12.5, 11.5, f);
    const sk = back ? K.skinB : K.skin;
    limb([[sx * 1.3, sy], el, hand], back ? 4.4 : 4.8, sk, K.skinL, K.skinD);
    const wx = el[0] + (hand[0] - el[0]) * .78, wy = el[1] + (hand[1] - el[1]) * .78;

  };

  leg(-f * 1.5, fb, true);
  leg(f * 1.5, fa, false);

  g.save(); g.scale(1.22, 1);

  poly([[-6.3, -39], [6.6, -39], [7.8, -22], [1.3, -21.5], [.3, -25], [-.8, -21.5], [-6.8, -22]], grad(-7, 8, K.jerD, K.jer, K.jerL));
  g.strokeStyle = K.trim; g.lineWidth = 1.3; g.beginPath(); g.moveTo(f * 1.2, -38.5); g.lineTo(f * 1.8, -22.3); g.stroke();

  // oreille, œil, sourcil, nez, bouche
  g.fillStyle = K.skinD; g.beginPath(); g.ellipse(hx - f * 1.4, hy + .3, .8, 1.3, 0, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.ellipse(hx + f * 2.3, hy - .5, .75, .55, 0, 0, 7); g.fill();

/* ---------- décor ---------- */
const CROWD = [];
(function () {
  const shirts = ['#fff', '#222', '#3a7d44', '#d94fa0', '#3567c7', '#f2c230', '#888', '#e07a2e'];
  const skins = ['#f1c27d', '#e0ac69', '#8d5524', '#c68642', '#ffdbac', '#5c3a1e'];
  for (let r = 0; r < 7; r++) for (let x = -480; x < 1580; x += 19)
    CROWD.push({ x: x + rnd(-5, 5) + (r % 2) * 9, r, c: Math.random() < .45 ? CONFIG.club.couleur : pick(shirts), sk: pick(skins), ph: rnd(0, 6) });
})();
const snap = v => Math.round(v / LS) * LS;
let crowdStrip = null;
function buildCrowd(s0) {
  const w = Math.ceil((2100 * s0 * .92 + 40) / LS), c = document.createElement('canvas');
  c.width = w; c.height = Math.ceil(130 / LS);
  const g = c.getContext('2d');
  for (const p of CROWD) {
    const sx = Math.round(((p.x + 480) * s0 * .92 + 20) / LS), sy = Math.round((66 + p.r * 15 + Math.sin(p.ph) * .8 - 40) / LS);
    g.fillStyle = p.c; g.beginPath(); g.ellipse(sx, sy + 6, 6.5, 6, 0, Math.PI, 0); g.fill(); g.fillRect(sx - 6.5, sy + 6, 13, 6);
    g.fillStyle = p.sk; g.beginPath(); g.arc(sx, sy - 1, 4.2, 0, 7); g.fill();
  }
  return c;
}

function drawArena() {
  ctx.fillStyle = '#0b0b0b'; ctx.fillRect(-10, -10, VW + 20, 60);
  const bands = ['#0f0909', '#160b0c', '#1d0d0e', '#250f11'];
  bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(-10, 50 + i * 26, VW + 20, 26); });
  const s0 = sc(0);
  if (G.hype <= .05) {
    // foule calme : une bande dessinée une seule fois, simplement décalée
    if (!crowdStrip) crowdStrip = buildCrowd(s0);
    const ox = snap(VW / 2 + (-480 - G.camX) * s0 * .92 - 20);
    ctx.drawImage(crowdStrip, ox, 40, crowdStrip.width * LS, crowdStrip.height * LS);
  } else for (const c of CROWD) {
    const sx = snap(VW / 2 + (c.x - G.camX) * s0 * .92);
    if (sx < -10 || sx > VW + 10) continue;
    const bob = (G.hype > .05 ? Math.abs(Math.sin(G.frame * .25 + c.ph)) * 6 * G.hype : 0) + Math.sin(G.frame * .03 + c.ph) * .8;
    const sy = snap(66 + c.r * 15 - bob);
    ctx.fillStyle = c.c; ctx.beginPath(); ctx.ellipse(sx, sy + 6, 6.5, 6, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(sx - 6.5, sy + 6, 13, 6);
    ctx.fillStyle = c.sk; ctx.beginPath(); ctx.arc(sx, sy - 1, 4.2, 0, 7); ctx.fill();
    if (G.hype > .4 && (c.ph * 10 | 0) % 3 === 0) { ctx.fillRect(sx - 8.5, sy - 12, 2.2, 13); ctx.fillRect(sx + 6.3, sy - 12, 2.2, 13); }
  }
  // panneau publicitaire
  const by = TOP - 48;
  ctx.fillStyle = CONFIG.club.fonce; ctx.fillRect(-10, by, VW + 20, 34);
  ctx.fillStyle = CONFIG.club.couleur; ctx.fillRect(-10, by + 4, VW + 20, 26);
  ctx.save(); ctx.beginPath(); ctx.rect(-10, by, VW + 20, 34); ctx.clip();
  const label = noAcc((CONFIG.club.nom + ' * ALLEZ ' + CONFIG.club.court + ' ! * ').toUpperCase());
  ctx.font = `16px ${PIX}`;
  const tw = ctx.measureText(label).width;
  let ox = snap((-(G.camX * s0 * .98) % tw) - tw);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  for (; ox < VW; ox += tw) ctx.fillText(label, snap(ox), by + 10);
  ctx.restore();
  ctx.fillStyle = '#120708'; ctx.fillRect(-10, by + 34, VW + 20, TOP - by - 34);
}

function drawCourt() {
  path3([[-200, -25], [W + 200, -25], [W + 200, D + 70], [-200, D + 70]], true);
  ctx.fillStyle = '#6e1a1d'; ctx.fill();
  path3([[0, 0], [W, 0], [W, D], [0, D]], true);
  ctx.fillStyle = '#d69a5c'; ctx.fill();
  ctx.lineWidth = 2;
  for (let y = 0, r = 0; y < D; y += 25, r++) {
    if (r % 2) { path3([[0, y], [W, y], [W, y + 25], [0, y + 25]], true); ctx.fillStyle = '#d29655'; ctx.fill(); }
  }
  ctx.fillStyle = CONFIG.club.couleur;
  path3([[0, 170], [190, 170], [190, 330], [0, 330]], true); ctx.fill();
  path3([[W, 170], [W - 190, 170], [W - 190, 330], [W, 330]], true); ctx.fill();
  path3(arcPts(550, 250, 62, 0, Math.PI * 2, 48), true); ctx.fillStyle = CONFIG.club.couleur; ctx.fill();
  const c = P(550, 250, 0);
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, .42);
  txt(CONFIG.club.court, 0, 0, 80 * c.s, '#fff', 'center', '900', 0, true);
  ctx.restore();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  path3([[0, 0], [W, 0], [W, D], [0, D]], true); ctx.stroke();
  path3([[550, 0], [550, D]]); ctx.stroke();
  path3(arcPts(550, 250, 62, 0, Math.PI * 2, 48), true); ctx.stroke();
  const a = Math.asin(220 / R3), cx = R3 * Math.cos(a);
  for (const h of HOOPS) {
    const left = h.x < 550, sgn = left ? 1 : -1, bx = left ? 0 : W, fx = left ? 190 : W - 190;
    path3([[bx, 170], [fx, 170], [fx, 330], [bx, 330]]); ctx.stroke();
    path3(left ? arcPts(fx, 250, 60, -Math.PI / 2, Math.PI / 2) : arcPts(fx, 250, 60, Math.PI / 2, Math.PI * 1.5)); ctx.stroke();
    const arc = left ? arcPts(h.x, h.y, R3, -a, a) : arcPts(h.x, h.y, R3, Math.PI - a, Math.PI + a);
    path3([[bx, 30], [h.x + sgn * cx, 30], ...arc, [h.x + sgn * cx, 470], [bx, 470]]);
    ctx.stroke();

}

function drawHoopBack(h) {

  ctx.strokeStyle = CONFIG.club.couleur; ctx.lineWidth = 14 * b0.s; ctx.beginPath(); ctx.moveTo(b0.x, b0.y); ctx.lineTo(b0.x, b0.y - 40 * b0.s); ctx.stroke();
  path3([[px, 250, 128], [h.bx, 250, 112]]); ctx.strokeStyle = '#2c2c2c'; ctx.lineWidth = 6; ctx.stroke();

  path3([[h.bx, 238, 96], [h.bx, 262, 96], [h.bx, 262, 114], [h.bx, 238, 114]], true);

}
function drawRim(h) {
  loVector();
  const r = P(h.x, h.y, RIM_Z), n = P(h.x, h.y, RIM_Z - 26);
  const rx = RIM_R * r.s, ry = rx * .38;
  ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(r.x + Math.cos(a) * rx, r.y + Math.sin(a) * ry);
    ctx.lineTo(n.x + Math.cos(a + .5) * rx * .6, n.y + Math.sin(a + .5) * ry * .6); ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(n.x, n.y, rx * .6, ry * .6, 0, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#ff5a1f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(r.x, r.y, rx, ry, 0, 0, 7); ctx.stroke();
}

function drawPlayer(p) {
  const g = P(p.x, p.y, 0), s = g.s, b = P(p.x, p.y, p.z);
  loVector();
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(g.x, g.y, 15 * s * (1 - Math.min(p.z, 150) / 300), 4.5 * s, 0, 0, 7); ctx.fill();
  if (G.inRange && G.inRange.target === p && G.frame % 12 < 8) {
    ctx.strokeStyle = G.inRange.steal ? '#ff3b3b' : '#ff8a3d'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(g.x, g.y, 23 * s, 7 * s, 0, 0, 7); ctx.stroke();
  }
  ctx.strokeStyle = G.teams[p.team].couleur; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(g.x, g.y, 16 * s, 5 * s, 0, 0, 7); ctx.stroke();
  if (p.human && !G.demo) { ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(g.x, g.y, 20 * s, 6 * s, 0, 0, 7); ctx.stroke(); }
  if (p.fire) { ctx.fillStyle = 'rgba(255,120,0,.3)'; ctx.beginPath(); ctx.ellipse(g.x, g.y, 24 * s, 7 * s, 0, 0, 7); ctx.fill(); }
  const spr = renderSprite(p, b), k = s / 1.4;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(spr, b.x - SPR_OX * k, b.y - SPR_OY * k, SPR_W * k, SPR_H * k);
  G.tags.push({ p, x: b.x + shk.x, y: b.y + shk.y - 122 * k });
}

function drawBall() {
  const g = P(ball.x, ball.y, 0), b = P(ball.x, ball.y, ball.z), r = Math.max(3, Math.round(6.4 * b.s / LS));
  loVector();
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(g.x, g.y, r * LS * (1 - Math.min(ball.z, 200) / 400), r * LS * .35, 0, 0, 7); ctx.fill();
  const fire = ball.owner && ball.owner.fire || (ball.shot && ball.shot.shooter.fire);
  if (fire) { ctx.fillStyle = 'rgba(255,140,0,.5)'; ctx.beginPath(); ctx.arc(b.x, b.y, r * LS * 1.9, 0, 7); ctx.fill(); }
  const R = r * LS, rot = G.frame * .2;
  const bg = ctx.createRadialGradient(b.x - R * .35, b.y - R * .4, R * .15, b.x, b.y, R);
  bg.addColorStop(0, '#ffb26b'); bg.addColorStop(.55, '#e8731c'); bg.addColorStop(1, '#9c4310');
  ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, 7); ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = '#3a1503'; ctx.lineWidth = 1; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, 7); ctx.clip();
  ctx.strokeStyle = 'rgba(58,21,3,.85)'; ctx.lineWidth = .9;
  ctx.beginPath(); ctx.moveTo(b.x - R * Math.cos(rot), b.y - R * Math.sin(rot)); ctx.lineTo(b.x + R * Math.cos(rot), b.y + R * Math.sin(rot)); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(b.x, b.y, R * .5, R, rot, 0, 7); ctx.stroke();
  ctx.restore();
  if (fire && G.frame % 2 === 0) spawn(ball.x, ball.y, ball.z, rnd(-.4, .4), 0, rnd(.5, 1.2), 16, pick(['#ff6a00', '#ffb300']), rnd(2, 4));
}

function drawParts() {
  loPixel();
  for (const q of G.parts) {
    const s = P(q.x, q.y, q.z), z = Math.max(1, Math.round(q.size * (.4 + .6 * q.life / q.max) * .55));
    loCtx.globalAlpha = Math.min(1, q.life / q.max * 1.6); loCtx.fillStyle = q.color;
    loCtx.beginPath(); loCtx.arc(s.x, s.y, z * .9, 0, 7); loCtx.fill();
  }
  loCtx.globalAlpha = 1;
  loVector();
}

function drawTags() {
  const placed = [];
  for (const t of [...G.tags].sort((a, b) => b.y - a.y)) {
    const p = t.p, human = p.human && !G.demo, label = noAcc(p.def.prenom.toUpperCase());
    ctx.font = `10px ${PIX}`;
    const w = Math.ceil(ctx.measureText(label).width) + 8, x = Math.round(t.x - w / 2);
    let y = Math.round(t.y - 14);
    // étiquettes décalées vers le haut si elles se chevauchent
    for (let k = 0; k < 4; k++) {
      const hit = placed.find(r => x < r.x + r.w + 4 && r.x < x + w + 4 && Math.abs(r.y - y) < 20);
      if (!hit) break; y = hit.y - 20;
    }
    placed.push({ x, y, w });
    ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y - 2, w + 4, 18);
    ctx.fillStyle = human ? '#ffd23f' : (p.fire ? '#ff6a00' : G.teams[p.team].couleur); ctx.fillRect(x, y, w, 14);
    txt(label, t.x, y + 8, 10, human ? '#111' : '#fff', 'center', 'pix');
    if (human) { ctx.fillStyle = '#ffd23f'; ctx.fillRect(Math.round(t.x) - 4, y + 16, 8, 2); ctx.fillRect(Math.round(t.x) - 2, y + 18, 4, 2); }
  }
}

function drawWorld() {
  ctx = loCtx;
  shk.x = G.shake > 1 ? Math.round(rnd(-G.shake, G.shake) / LS) : 0;
  shk.y = G.shake > 1 ? Math.round(rnd(-G.shake, G.shake) / LS) : 0;
  loCtx.imageSmoothingEnabled = false;
  loVector();
  drawArena(); drawCourt();
  for (const h of HOOPS) drawHoopBack(h);
  G.tags = [];
  const ents = G.players.map(p => ({ y: p.y, d: () => drawPlayer(p) }));
  ents.push({ y: ball.owner ? ball.owner.y + .5 : ball.y + .2, d: drawBall });
  for (const h of HOOPS) ents.push({ y: h.y + .1, d: () => drawRim(h) });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.d());
  drawParts();
  ctx = mainCtx;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(lo, 0, 0, VW, VH);
  drawTags();
  const me = G.players.find(p => p.human && !G.demo);
  if (me) {
    const q = P(me.x, me.y, me.z + 40);
    if (q.x < 0 || q.x > VW) {
      const left = q.x < 0, x = left ? 14 : VW - 14;
      ctx.fillStyle = '#ffd23f'; ctx.beginPath();
      ctx.moveTo(x + (left ? -8 : 8), q.y); ctx.lineTo(x + (left ? 10 : -10), q.y - 11); ctx.lineTo(x + (left ? 10 : -10), q.y + 11); ctx.fill();
      txt(me.def.prenom.toUpperCase(), left ? x + 16 : x - 16, q.y, 10, '#ffd23f', left ? 'left' : 'right', 'pix', 4);
    }
  }
}

/* ---------- interface ---------- */
function fmtClock(t) {
  if (t < 10) return t.toFixed(1);
  const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0');
}
function drawHUD() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, 46);
  for (let t = 0; t < 2; t++) {

  }

  if (!G.demo) {
    txt(String(Math.max(0, Math.ceil(G.shotClock))), 556, 32, 11, G.shotClock < 6 ? '#ff5252' : '#ffd23f', 'center', 'pix');

  if (!G.demo) txt(G.muted ? '🔇' : '🔊', 480, VH - 20, 16, '#fff');

    const x = p.team ? VW - 240 + p.idx * 118 : 12 + p.idx * 118, y = VH - 34;
    txt(p.def.prenom.toUpperCase(), x, y + 6, 8, p.human && !G.demo ? '#ffd23f' : '#fff', 'left', 'pix');
    const n = Math.round(p.turbo / 10);
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = i < n ? (p.fire ? '#ff6a00' : (p.turbo > 25 ? '#3ddc84' : '#ffb300')) : '#2a2a2a';
      ctx.fillRect(x + i * 10, y + 16, 8, 8);
    }
    if (p.fire && G.frame % 20 < 12) txt('🔥', x + 104, y + 10, 14, '#fff', 'left');
  }
}

function drawAnnounce() {
  G.ann.forEach((a, i) => {
    const k = a.t / a.life, pop = a.t < 6 ? .5 + a.t / 6 * .6 : (a.t < 10 ? 1.1 - (a.t - 6) / 4 * .1 : 1);
    ctx.globalAlpha = k > .8 ? (1 - k) / .2 : 1;
    ctx.save(); ctx.translate(480, 170 + i * 56 - (G.ann.length - 1) * 28); ctx.scale(pop, pop); ctx.rotate(-.03);
    const sz = Math.round(a.size * .52);

    ctx.restore();

}

function drawTouch() {
  if (!G.touch || G.scene !== 'play' || G.paused) return;
  ctx.globalAlpha = .55;
  if (touch.joyId !== null) {
    ctx.strokeStyle = touch.full ? '#ff8a3d' : '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(touch.jx0, touch.jy0, 55, 0, 7); ctx.stroke();
    ctx.fillStyle = touch.full ? '#ff8a3d' : '#fff'; ctx.beginPath(); ctx.arc(touch.jx0 + touch.jx * 55, touch.jy0 + touch.jy * 55, 24, 0, 7); ctx.fill();
    if (touch.full) txt('TURBO', touch.jx0, touch.jy0 - 72, 12, '#ff8a3d', 'center', 'pix', 4);
  } else txt('◀ glisse ici · à fond = turbo ▶', 210, 470, 18, '#fff', 'center', '700', 4);
  const att = humanAttacking(), R = G.inRange;
  for (const k in BTN) {
    const b = BTN[k], label = att ? b.att : b.def, on = touch.btn[k] !== null;
    if (!label) continue;
    // à portée : le bouton s'allume
    const lit = !att && R && ((k === 'passe' && R.steal) || k === 'pousser');
    ctx.globalAlpha = lit ? .9 : .55;
    ctx.fillStyle = on ? '#fff' : lit ? (k === 'passe' ? '#ffd23f' : '#ff8a3d') : (k === 'tir' ? CONFIG.club.couleur : (att ? '#222' : '#1f3d8f'));
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + (lit && G.frame % 16 < 8 ? 4 : 0), 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    txt(label, b.x, b.y + 1, k === 'tir' ? 14 : 10, on || lit ? '#000' : '#fff', 'center', 'pix');
  }
  ctx.globalAlpha = 1;
}

function drawLogo(y, size) {
  ctx.save(); ctx.translate(480, y); ctx.transform(1, 0, -.18, 1, 0, 0);
  txt('MBC', -size * 1.75, 0, size, CONFIG.club.couleur, 'center', 'pix', Math.max(4, size / 5));
  txt('JAM', size * 1.75, 0, size, '#fff', 'center', 'pix', Math.max(4, size / 5));
  ctx.restore();
}

function drawTitle() {
  drawWorld();
  ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fillRect(0, 0, VW, VH);
  drawLogo(150, 64);
  txt(CONFIG.club.nom, 480, 240, 18, '#fff', 'center', 'pix', 6);
  txt('2 CONTRE 2 · TURBO · DUNKS · EN FEU', 480, 280, 18, '#ffd23f', 'center', '700');
  txt('< DIFFICULTÉ : ' + DIFF[G.diff].nom + ' >', 480, 370, 14, '#fff', 'center', 'pix', 5);
  if (G.frame % 60 < 40) txt(G.touch ? "TOUCHE L'ÉCRAN POUR JOUER" : 'APPUIE SUR ESPACE POUR JOUER', 480, 430, 16, '#fff', 'center', 'pix', 6);
  txt('CREDIT 01', 20, 528, 9, '#ffd23f', 'left', 'pix');
  txt('v8', 940, 528, 8, '#666', 'right', 'pix');
  txt(G.touch ? 'Joystick à gauche (à fond = turbo) · TIR près du panier = dunk' : 'Flèches/ZQSD · Tir : Espace (près du panier = dunk) · Passe/Vol : K · Turbo : Maj · Pousser : Maj+K · M : son', 480, 500, 15, '#bbb', 'center', '700');
}

function drawStatBar(x, y, label, v, w) {
  txt(label, x, y, 12, '#aaa', 'left', '700');
  const n = Math.round(v), seg = (w - 9) / 10;
  for (let i = 0; i < 10; i++) { ctx.fillStyle = i < n ? CONFIG.club.couleur : '#333'; ctx.fillRect(Math.round(x + 38 + i * (seg + 1)), y - 4, Math.max(1, Math.floor(seg)), 8); }
}
function drawSelect() {
  ctx.fillStyle = '#120708'; ctx.fillRect(0, 0, VW, VH);
  drawLogo(36, 22);
  txt('CHOISIS TON DUO', 480, 78, 18, '#fff', 'center', 'pix');
  txt('◀ menu', 14, 22, 15, '#888', 'left', '700');
  const L = selectLayout();
  CONFIG.joueurs.forEach((j, i) => {
    const c = L[i], si = G.sel.indexOf(i), cur = G.cur === i;
    ctx.fillStyle = si >= 0 ? '#3a1416' : '#1c1c1c'; ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.lineWidth = cur ? 4 : 2; ctx.strokeStyle = cur ? '#ffd23f' : (si >= 0 ? CONFIG.club.couleur : '#333'); ctx.strokeRect(c.x, c.y, c.w, c.h);
    txt(j.prenom.toUpperCase(), c.x + 10, c.y + 20, 11, '#fff', 'left', 'pix');
    txt(String(j.numero), c.x + c.w - 10, c.y + 20, 14, CONFIG.club.couleur, 'right', 'pix');
    const rows = [['VIT', j.vitesse], ['TIR', j.tir], ['3PTS', j.trois], ['DUNK', j.dunk], ['DÉF', j.defense]];
    const step = (c.h - 50) / 5;
    if (step > 9) rows.forEach((r, k) => drawStatBar(c.x + 10, c.y + 46 + k * step, r[0], r[1], c.w - 120));
    // aperçu du joueur en pixel art (il court quand il est choisi)
    const fake = { def: j, team: 0, face: 1, state: 'run', z: 0, vx: si >= 0 ? 1 : 0, vy: 0, anim: G.frame * .2, reach: 0 };
    const spr = renderSprite(fake, null);
    const sk = (c.h - 14) / SPR_H;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(spr, c.x + c.w - 6 - (SPR_OX + 28) * sk, c.y + c.h - 6 - SPR_OY * sk, SPR_W * sk, SPR_H * sk);
    if (si >= 0) {
      const bw = si === 0 ? 40 : 100, bx = c.x + c.w - 10 - bw;
      ctx.fillStyle = si === 0 ? '#ffd23f' : '#fff'; ctx.fillRect(bx, c.y + 32, bw, 16);
      txt(si === 0 ? 'TOI' : 'COÉQUIPIER', bx + bw / 2, c.y + 41, 8, '#111', 'center', 'pix');
    }
  });
  const b = PLAY_BTN, ready = G.sel.length === 2;
  ctx.fillStyle = ready ? CONFIG.club.couleur : '#2a2a2a'; ctx.fillRect(b.x, b.y, b.w, b.h);
  if (G.cur === CONFIG.joueurs.length) { ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 4; ctx.strokeRect(b.x, b.y, b.w, b.h); }
  if (ready) txt('JOUER >', b.x + b.w / 2, b.y + b.h / 2 + 1, 18, '#fff', 'center', 'pix');
  else txt(G.sel.length ? 'CHOISIS TON COÉQUIPIER' : 'CHOISIS TON JOUEUR', b.x + b.w / 2, b.y + b.h / 2 + 1, 17, '#888', 'center', '900');
  txt('CONTRE : ' + CONFIG.adversaire.nom + '  ·  ' + DIFF[G.diff].nom, 480, 527, 15, '#888', 'center', '700');
}

function drawOver() {
  drawWorld(); drawHUD();
  ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, VW, VH);
  const win = G.over.win;
  txt(win ? 'VICTOIRE !' : 'DÉFAITE...', 480, 90, 44, win ? '#ffd23f' : '#ccc', 'center', 'pix', 10);
  txt(`${G.teams[0].nom}  ${G.score[0]} - ${G.score[1]}  ${G.teams[1].nom}`, 480, 160, 30, '#fff', 'center', '900', 5);
  const cols = ['', 'PTS', '3PTS', 'DUNKS', 'INT.', 'CONTRES'], xs = [250, 450, 530, 610, 690, 770];
  cols.forEach((c, i) => txt(c, xs[i], 215, 15, '#aaa', i ? 'center' : 'left', '700'));
  G.players.forEach((p, k) => {
    const y = 250 + k * 36;
    ctx.fillStyle = k % 2 ? 'rgba(255,255,255,.04)' : 'rgba(255,255,255,.08)'; ctx.fillRect(230, y - 16, 580, 32);
    ctx.fillStyle = G.teams[p.team].couleur; ctx.fillRect(230, y - 16, 6, 32);
    txt(p.def.prenom + '  #' + p.def.numero, xs[0], y, 20, p.human ? '#ffd23f' : '#fff', 'left', '900');
    const st = p.stats;[st.pts, st.trois, st.dunks, st.inter, st.contres].forEach((v, i) => txt(String(v), xs[i + 1], y, 20, '#fff'));
  });
  if (G.frame % 60 < 40) txt(G.touch ? "TOUCHE L'ÉCRAN POUR REJOUER" : 'ESPACE : REJOUER · ÉCHAP : MENU', 480, 450, 14, '#fff', 'center', 'pix', 5);
}

function render() {
  ctx = mainCtx;
  ctx.setTransform(cv.width / VW, 0, 0, cv.height / VH, 0, 0);
  ctx.fillStyle = '#0d0d0d'; ctx.fillRect(0, 0, VW, VH);
  if (G.scene === 'title') drawTitle();
  else if (G.scene === 'select') drawSelect();
  else if (G.scene === 'over') drawOver();
  else {
    drawWorld(); drawHUD(); drawAnnounce(); drawTouch();
    if (G.scene === 'break') {
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 140, VW, 160);
      txt(G.breakMsg.toUpperCase(), 480, 200, 26, '#fff', 'center', 'pix', 8);
      txt(`${G.teams[0].court} ${G.score[0]} - ${G.score[1]} ${G.teams[1].court}`, 480, 258, 20, '#ffd23f', 'center', 'pix', 6);
    }
    if (G.paused) {
      ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, VW, VH);
      txt('PAUSE', 480, 200, 44, '#fff', 'center', 'pix', 10);
      txt(G.touch ? 'Touche pour reprendre' : 'P : reprendre  ·  Échap : quitter', 480, 260, 22, '#ccc', 'center', '700');
      ctx.fillStyle = '#333'; ctx.fillRect(380, 300, 200, 50);
      txt('QUITTER', 480, 326, 14, '#fff', 'center', 'pix');
    }
  }
  if (G.touch && innerHeight > innerWidth) {
    ctx.fillStyle = 'rgba(0,0,0,.85)'; ctx.fillRect(0, 0, VW, VH);
    txt('TOURNE TON TÉLÉPHONE', 480, 270, 22, '#fff', 'center', 'pix', 6);
  }
}

/* ---------- boucle & redimensionnement ---------- */
function resize() {
  const k = Math.min(innerWidth / VW, innerHeight / VH);
  const w = Math.floor(VW * k), h = Math.floor(VH * k), dpr = Math.min(2, devicePixelRatio || 1);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
}
addEventListener('resize', resize);
resize();
toTitle();

let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// accès pour les tests automatisés
window.MBCJAM = { G, ball, step: n => { for (let i = 0; i < n; i++) update(); }, newGame, CONFIG };
</script>
</body>
